<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Portal 99 Terceirização</title>
<style>
  body { font-family: Arial; background:#f4f6f8; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  form { background:#fff; padding:40px; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,.1); text-align:center; width:300px; }
  h2 { margin-bottom:20px; color:#004aad; }
  input { width:100%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:6px; }
  button { width:100%; padding:10px; background:#004aad; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
  button:hover { background:#003680; }
  .erro { color:red; font-weight:bold; display:none; margin-bottom:10px; }
</style>
</head>
<body>

<form onsubmit="return login()">
  <h2>Portal 99 Cargas</h2>
  <div class="erro" id="erro">Usuário ou senha incorretos!</div>
  <input type="email" id="user" placeholder="E-mail" required>
  <input type="password" id="pass" placeholder="Senha" required>
  <button type="submit">Entrar</button>
</form>

<script>
  const usuarios = {
    "atendimento1@99cargas.com": "230407",
    "atendimento2@99cargas.com": "RecursosHumanos"
  };

  function login(){
    const u = document.getElementById('user').value.trim().toLowerCase();
    const p = document.getElementById('pass').value.trim();
    const erro = document.getElementById('erro');

    if(usuarios[u] && usuarios[u] === p){
      sessionStorage.setItem("usuarioLogado", u);
      window.location.href = "index.html";
    } else {
      erro.style.display = "block";
    }
    return false;
  }
</script>
</body>
</html>
